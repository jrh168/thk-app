<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>特好考 学习小帮手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #f0f2f5; padding: 15px; }
.container { max-width: 100%; margin: 0 auto; }
.card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
h3 { font-size: 16px; margin-bottom: 10px; }

.app-header { text-align: center; margin-bottom: 20px; padding: 15px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.logo-container { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
.logo { width: 60px; height: 60px; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: transparent; flex-shrink: 0; }
.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.app-title { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
.app-subtitle { font-size: 13px; color: #666; }
.tech-support { background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 6px; padding: 6px; margin-bottom: 12px; font-size: 12px; color: #0050b3; text-align: center; }

.password-modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
.password-content { background: #fff; padding: 25px; border-radius: 10px; text-align: center; width: 100%; max-width: 360px; }
.password-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
.password-input:focus { border-color: #1890ff; }
.password-btn { background: #1890ff; color: #fff; border: none; border-radius: 8px; padding: 12px; cursor: pointer; font-size: 15px; width: 100%; margin-top: 8px; }
.password-btn:hover { background: #1070d0; }
.login-label { font-size: 13px; color: #666; text-align: left; display: block; margin-top: 12px; margin-bottom: 4px; }
.login-error { color: #ff4d4f; margin-top: 10px; font-size: 12px; display: none; }

.user-info { background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; color: #0050b3; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.user-info-left { display: flex; flex-direction: column; gap: 6px; line-height: 1.5; }
.logout-btn { background: #ff4d4f; color: #fff; border: none; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 12px; flex-shrink: 0; align-self: center; }
.logout-btn:hover { background: #d9363e; }
.job-selector { padding: 4px 8px; border-radius: 4px; border: 1px solid #91d5ff; font-size: 13px; color: #0050b3; background: #fff; outline: none; cursor: pointer; margin-left: 4px; }
.validity-inline { display: none; color: #389e0d; font-size: 12px; }

.success { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; padding: 8px; border-radius: 6px; font-size: 13px; }
.storage-warn { background: #fff7e6; border: 1px solid #ffd591; color: #ad6800; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 12px; display: none; }

.exam-btn { background: #722ed1; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; cursor: pointer; width: 100%; margin-bottom: 8px; font-size: 15px; font-weight: 600; transition: all 0.3s; opacity: 0.65; transform: scale(0.98); }
.exam-btn:hover { opacity: 0.9; transform: scale(1); }
.exam-btn.active { opacity: 1; transform: scale(1.02); box-shadow: 0 0 0 3px rgba(114,46,209,0.3); }
.practice-btn.active { box-shadow: 0 0 0 3px rgba(24,144,255,0.4); }
.select-btn.active { box-shadow: 0 0 0 3px rgba(82,196,26,0.4); }
.wrong-btn.active { box-shadow: 0 0 0 3px rgba(250,84,28,0.4); }
#startVipPracticeBtn.active { box-shadow: 0 0 0 3px rgba(250,173,20,0.4); }
#startExamBtn.active { box-shadow: 0 0 0 3px rgba(114,46,209,0.4); }

.exam-btn.wrong-btn { background: #fa541c; }
.exam-btn.practice-btn { background: #1890ff; }
.exam-btn.select-btn { background: #52c41a; }
.exam-btn-control { background: #1890ff; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
.exam-btn-control.danger { background: #ff4d4f; }
.exam-btn-control.green { background: #52c41a; }
.exam-btn-control.gold { background: #faad14; }
.exam-btn-control:disabled { opacity: .45; cursor: not-allowed; }

.question-item { border: 1px solid #e8e8e8; border-radius: 8px; padding: 12px; margin-bottom: 8px; position: relative; }
.question-title { font-weight: bold; margin-bottom: 10px; color: #333; margin-top: 24px; font-size: 17px; line-height: 1.6; word-break: break-word; }
.question-type { position: absolute; top: 8px; left: 12px; background: #1890ff; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
.question-type.multiple { background: #fa541c; }
.question-type.judgment { background: #52c41a; }
.question-number { position: absolute; top: 8px; right: 12px; background: #722ed1; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
.option { padding: 10px 12px; margin-bottom: 6px; background: #fafafa; border-radius: 4px; cursor: pointer; transition: all .2s; font-size: 15.5px; border: 1px solid #f0f0f0; word-break: break-word; }
.option:hover { background: #f0f0f0; }
.option.selected { background: #1890ff; color: #fff; border-color: #1890ff; }
.option.correct { background: #f6ffed; border-color: #b7eb8f; color: #389e0d; }
.option.wrong { background: #fff2f0; border-color: #ffccc7; color: #a8071a; }
.correct-answer { color: #52c41a; font-weight: bold; margin-top: 10px; padding: 10px; background: #f6ffed; border-radius: 4px; font-size: 15px; }
.multi-select-hint { font-size: 13px; color: #fa541c; margin-bottom: 8px; font-style: italic; }
.selected-options { margin-top: 8px; font-size: 14.5px; color: #1890ff; font-weight: bold; }

.exam-info { background: #f0f8ff; border: 1px solid #91d5ff; border-radius: 6px; padding: 12px; margin-bottom: 12px; text-align: center; }
.exam-timer { font-size: 22px; font-weight: bold; color: #1890ff; margin: 8px 0; }
.exam-progress { font-size: 14px; color: #666; margin-bottom: 8px; }
.exam-controls { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.exam-result { text-align: center; padding: 15px; }
.result-score { font-size: 40px; font-weight: bold; margin: 15px 0; }
.result-pass { color: #52c41a; }
.result-fail { color: #ff4d4f; }
.result-details { margin: 15px 0; text-align: left; font-size: 14px; line-height: 2; background: #fafafa; padding: 12px; border-radius: 6px; }

.score-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.score-table th, .score-table td { border: 1px solid #e8e8e8; padding: 6px 4px; text-align: center; }
.score-table th { background: #f0f8ff; color: #1890ff; font-weight: 600; }
.score-table td.pass { color: #52c41a; font-weight: bold; }
.score-table td.fail { color: #ff4d4f; font-weight: bold; }
.score-summary { display: flex; justify-content: space-around; margin: 10px 0; padding: 10px; background: #fafafa; border-radius: 6px; font-size: 13px; }
.score-summary div { text-align: center; }
.score-summary .num { font-size: 20px; font-weight: bold; color: #1890ff; display: block; }
.score-trend { display: flex; align-items: flex-end; gap: 3px; height: 80px; margin: 10px 0; padding: 0 5px; }
.score-trend .bar { flex: 1; background: linear-gradient(180deg, #1890ff, #91d5ff); border-radius: 4px 4px 0 0; min-height: 5px; position: relative; transition: height .3s; }
.score-trend .bar.pass-bar { background: linear-gradient(180deg, #52c41a, #b7eb8f); }
.score-trend .bar.fail-bar { background: linear-gradient(180deg, #ff4d4f, #ffccc7); }
.score-trend .bar span { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #666; white-space: nowrap; }
.score-empty { text-align: center; padding: 25px 15px; color: #999; font-size: 13px; line-height: 1.8; background: #fafafa; border-radius: 6px; }
.score-empty .big { font-size: 32px; display: block; margin-bottom: 8px; }

.hidden { display: none !important; }
.badge { display: inline-block; background: #fa541c; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; margin-left: 6px; font-weight: bold; }
.empty-tip { text-align: center; padding: 30px 15px; color: #999; font-size: 14px; }
.empty-tip .emoji { font-size: 40px; display: block; margin-bottom: 12px; }
.wrong-hint { font-size: 13px; color: #fa541c; margin-bottom: 10px; text-align: left; padding: 8px 10px; background: #fff2f0; border-radius: 4px; }
.version-info { position: fixed; bottom: 8px; right: 8px; font-size: 10px; color: #999; background: rgba(255,255,255,.9); padding: 4px 8px; border-radius: 12px; }

.thk-confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
.thk-confirm-box { background: #fff; border-radius: 12px; padding: 22px; max-width: 320px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.25); animation: thkFadeIn .15s ease; }
@keyframes thkFadeIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.thk-confirm-msg { font-size: 15px; color: #333; margin-bottom: 20px; line-height: 1.6; text-align: center; word-break: break-word; }
.thk-confirm-btns { display: flex; gap: 10px; }
.thk-confirm-btns button { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; }
.thk-confirm-cancel { background: #f0f0f0; color: #666; }
.thk-confirm-cancel:hover { background: #e0e0e0; }
.thk-confirm-ok { background: #1890ff; color: #fff; }
.thk-confirm-ok:hover { background: #1070d0; }

@media screen and (orientation: landscape) {
    .container { max-width: 900px; }
    .question-title { font-size: 18px; }
    .option { font-size: 16px; }
}
</style>
</head>
<body>

<div class="password-modal" id="passwordModal">
    <div class="password-content">
        <h2 style="font-size: 18px; margin-bottom: 6px;">🔐 特好考 学习小帮手</h2>
        <p style="font-size: 12px; color: #999; margin-bottom: 15px;">请输入手机号及尾号（后6位）登录</p>

        <label class="login-label" for="phoneInput">手机号码</label>
        <input type="tel" class="password-input" id="phoneInput" placeholder="请输入11位手机号" maxlength="11" inputmode="numeric">

        <label class="login-label" for="codeInput">密码（手机号后6位）</label>
        <input type="password" class="password-input" id="codeInput" placeholder="请输入手机号后6位" maxlength="6" inputmode="numeric">

</div>

<div class="container" id="mainContent" style="display:none;">

    <div class="app-header">
        <div class="logo-container">
            <div class="logo"><img id="appLogo" alt="特好考"></div>
            <div>
                <h1 class="app-title">特好考 学习小帮手</h1>

        </div>
    </div>

    <div class="tech-support">题库充值续费联系报名老师🔙 技术支持 thk811116@163.com</div>

        ⚠️ 当前环境不支持持久化存储，本次数据仅在当前会话有效（关闭页面后会清空）。建议使用现代浏览器打开。
    </div>

    <div id="userInfo" class="user-info" style="display:none;">
        <div class="user-info-left">
            <span>👤 <b id="userName">--</b> ｜ 工种：
                <b id="userJob" style="display:none;">--</b>

    <div class="card">

            <div class="exam-timer" id="examTimer">60:00</div>

                <button class="exam-btn-control danger" id="wrongClearBtn">清空错题本</button>

<div class="version-info">v9.9.7 ｜ 下拉刷新题库版</div>

<script>
'use strict';

const LOGO_URL = 'https://i.postimg.cc/mkzHkLNd/THKlogo-3340-1-removebg-preview.png';

// =====================================================================
// 🚨【重要提示】每次你修改了这个代码文件（比如添加了新用户），
// 请务必把下面的日期改成你修改代码当天的日期！
// 如果用户清空了缓存，系统会以这个日期为起点重新计算58天，防止无限白嫖。
// =====================================================================
const BUILD_TIME = new Date('2026-10-22T00:00:00').getTime(); 

/* ============================================================
   一、Storage 封装（自动回退内存存储）
   ============================================================ */
const MemoryStorage = (() => {
    const store = Object.create(null);
    return {
        getItem: k => (k in store ? store[k] : null),
        setItem: (k, v) => { store[k] = String(v); },
        removeItem: k => { delete store[k]; }
    };
})();

let __storage = null;
let __storageIsPersistent = false;

function getStorage() {
    if (__storage) return __storage;
    try {
        const k = '__thk_storage_test__';
        window.localStorage.setItem(k, '1');
        window.localStorage.removeItem(k);
        __storage = window.localStorage;
        __storageIsPersistent = true;
    } catch (e) {
        __storage = MemoryStorage;
        __storageIsPersistent = false;
    }
    return __storage;
}

function storageGet(key) {
    try { return getStorage().getItem(key); } catch (e) { return null; }
}
function storageSet(key, val) {
    try { getStorage().setItem(key, val); return true; } catch (e) { return false; }
}
function storageRemove(key) {
    try { getStorage().removeItem(key); } catch (e) {}
}
function isPersistentStorage() { getStorage(); return __storageIsPersistent; }

/* ============================================================
   二、基础配置
   ============================================================ */
let WHITELIST = []; // 从 users.json 动态加载

// 加载名单的函数（带时间戳防缓存）
async function loadUsers() {
    try {
        const res = await fetch('https://cdn.jsdelivr.net/gh/jrh168/thk-data@main/banks/users.json?t=' + Date.now());
        if (res.ok) {
            WHITELIST = await res.json();
            console.log("名单加载成功，共 " + WHITELIST.length + " 人");
        } else {
            console.error("名单加载失败，请检查 users.json 是否存在");
        }
    } catch (e) {
        console.error("名单格式错误，请检查 JSON 格式是否正确（比如少逗号、多了注释）", e);
    }
}

const CDN_BASE = 'https://cdn.jsdelivr.net/gh/jrh168/thk-data@main/banks/';
const BANK_DATA_VERSION = "v20261014_06";

const BANK_CONFIG = {
    '安全管理员': { practice: 'anquan1-dtk.json',  featured: 'anquan2-ckt.json', vip: 'vip-anquan.json' },
    '场（厂）内专用车': { practice: 'chache1-dtk.json',  featured: 'chache2-ckt.json', vip: 'vip-chache.json' },
    '流动式起重机': { practice: 'diaoche1-dtk.json', featured: 'diaoche2-ckt.json', vip: 'vip-diaoche.json' },
    '起重机指挥': { practice: 'qizhong1-dtk.json', featured: 'qizhong2-ckt.json', vip: 'vip-qizhong.json' },
    '起重机司机': { practice: 'xingche1-dtk.json', featured: 'xingche2-ckt.json', vip: 'vip-xingche.json' }
};

const QR_TOKENS = { 'thk_zs_2026': '13800000001', 'thk_ls_2026': '13800000002' };

const SESSION_DAYS  = 28;
const EXAM_MINUTES  = 60;
const EXAM_MAX_Q    = 100;
const PASS_SCORE    = 70;
const CACHE_HOURS   = 24;
const SCORE_MAX     = 20;

/* ============================================================
   三、单端登录控制变量
   ============================================================ */
let __mySessionId = null;
let currentQuizMode = 'practice'; // 记录当前练习界面的模式，防止题库串用

/* ============================================================
   四、小工具
   ============================================================ */
let __uidSeed = 0;
const nextUid = () => 'q' + (++__uidSeed);

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
}

function daysBetween(a, b) { return Math.ceil((b - a) / 86400000); }

function formatDuration(seconds) {
    if (seconds == null || seconds < 0) return '—';
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}分${String(s).padStart(2, '0')}秒`;
}

/* ============================================================
   五、弹窗与提示
   ============================================================ */
function showConfirm(msg, onOk, onCancel) {
    const existing = document.querySelector('.thk-confirm-overlay');
    if (existing) existing.remove();

/* ============================================================
   六、题目解析
   ============================================================ */
function stripLetterPrefix(text) {
    return String(text).trim().replace(/^[A-Za-z]\s*[.、．:：)）]\s*/, '');
}
function extractText(v) {
    if (v == null) return '';
    if (typeof v === 'object') return String(v.text ?? v.content ?? v.value ?? v.label ?? '');
    return String(v);
}
function normalizeOptions(src) {
    const out = [];
    if (Array.isArray(src)) { src.forEach(v => out.push(extractText(v))); }
    else if (src && typeof src === 'object') { Object.keys(src).sort().forEach(k => out.push(extractText(src[k]))); }
    return out.map(stripLetterPrefix).map(s => s.trim()).filter(s => s !== '');
}

function toLetters(raw, options) {
    const s = String(raw == null ? '' : raw).trim();
    if (!s) return '';

    if (options && options.length === 2) {
        const a = options[0].trim(), b = options[1].trim();
        const yes = /^(正确|对|是|√|T|True)$/i.test(a) && /^(错误|错|否|×|F|False)$/i.test(b);
        const no  = /^(错误|错|否|×|F|False)$/i.test(a) && /^(正确|对|是|√|T|True)$/i.test(b);
        if (yes || no) {
            if (/^(对|正确|是|√|T|TRUE)$/i.test(s)) return 'A';
            if (/^(错|错误|否|×|X|F|FALSE)$/i.test(s)) return 'B';
        }
    }

    const upper = s.toUpperCase();
    const letters = upper.match(/[A-Z]/g);
    if (letters && letters.length > 0) return letters.sort().join('');

    if (/^\d+$/.test(s)) {
        const num = parseInt(s, 10);
        return String.fromCharCode(65 + num - 1);
    }

    const norm = t => String(t).replace(/[\s。．.、,，;；:：]/g, '').toUpperCase();
    const target = norm(s);
    const matched = [];
    (options || []).forEach((opt, i) => { if (norm(opt) === target) matched.push(String.fromCharCode(65 + i)); });
    if (matched.length) return matched.sort().join('');
    return '';
}

function convertQuestionFormat(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.map((item, index) => {
        if (!item || typeof item !== 'object') return null;
        const question = String(item.question ?? item.题目 ?? item.题干 ?? item.stem ?? item.title ?? '').trim();
        if (!question) return null;
        const options = normalizeOptions(item.options ?? item.选项 ?? item.opts ?? []);
        if (!options.length) return null;

        let correctAnswer = String(item.answer ?? item.答案 ?? item.正确答案 ?? item.correct ?? '').trim();
        if (!correctAnswer) correctAnswer = 'A';

        let type = String(item.type ?? item.题型 ?? '').trim();
        if (type.includes('多选')) type = '多选题';
        else if (type.includes('判断')) type = '判断题';
        else if (type.includes('单选')) type = '单选题';
        else type = '';

        return { uid: nextUid(), srcIndex: index, question, options, correctAnswer, type };
    }).filter(Boolean);
}

/* ============================================================
   七、题型判定
   ============================================================ */
const TYPE_TEXT = { single: '单选题', multiple: '多选题', judgment: '判断题' };
function getQType(q) {
    const t = String(q.type || ''), question = String(q.question || '');
    if (question.includes('多选') || t.includes('多选')) return 'multiple';
    if (question.includes('判断') || t.includes('判断')) return 'judgment';

    const opts = (q.options || []).filter(o => o !== '');
    if (opts.length === 2) {
        const a = opts[0].trim(), b = opts[1].trim();
        if (/^(正确|对|是|√|T|True)$/i.test(a) && /^(错误|错|否|×|F|False)$/i.test(b)) return 'judgment';
        if (/^(错误|错|否|×|F|False)$/i.test(a) && /^(正确|对|是|√|T|True)$/i.test(b)) return 'judgment';
    }
    const letters = toLetters(q.correctAnswer, q.options);
    if (letters.length > 1) return 'multiple';
    return 'single';
}

function calculateUserExpire(user) {
    if (user.expire === '长期') {
        return { isLongTerm: true, expireDate: null, expireStr: '长期' };
    }

    const days = parseInt(user.expire, 10) || 58;
    const firstLoginKey = 'thk_first_login_' + user.phone;
    let firstLoginTime = storageGet(firstLoginKey);

    if (!firstLoginTime) {
        firstLoginTime = BUILD_TIME; 
        storageSet(firstLoginKey, firstLoginTime);
    } else {
        firstLoginTime = parseInt(firstLoginTime, 10);
    }

    const expireDate = new Date(firstLoginTime + days * 86400000);
    const y = expireDate.getFullYear();
    const m = String(expireDate.getMonth() + 1).padStart(2, '0');
    const d = String(expireDate.getDate()).padStart(2, '0');

    return {
        isLongTerm: false,
        expireDate: expireDate,
        expireStr: `${y}-${m}-${d}`
    };
}

function validateUser(user) {
    if (!user) return { ok: false, msg: '账号不存在，请联系管理员' };

    const expInfo = calculateUserExpire(user);
    if (expInfo.isLongTerm) return { ok: true };

    const now = new Date();
    if (now > expInfo.expireDate) {
        return { ok: false, msg: `账号已到期（${expInfo.expireStr}），请联系管理员续期` };
    }
    if (now.getFullYear() < 2024) {
        return { ok: false, msg: `系统时间异常，请校准您的电脑时间后再试` };
    }
    return { ok: true };
}

    if (code !== phone.slice(-6)) return showLoginError('密码错误（应为手机号后6位）');
    const user = findUser(phone);
    const v = validateUser(user);
    if (!v.ok) return showLoginError(v.msg);

    loginSuccess(user);
}

    if (!isPersistentStorage()) $('storageWarn').style.display = 'block';

/* ============================================================
   十、题库加载
   ============================================================ */
async function fetchBank(fileName, cacheKey) {
    const finalCacheKey = cacheKey + '_' + BANK_DATA_VERSION;
    try {
        const raw = storageGet(finalCacheKey);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed._time && Date.now() - parsed._time < CACHE_HOURS * 3600000) return parsed.data;
        }
    } catch (e) {}

    try {
        const res = await fetch(CDN_BASE + fileName + '?t=' + Date.now(), { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        storageSet(finalCacheKey, JSON.stringify({ _time: Date.now(), data }));
        return data;
    } catch (e) {
        try { const raw = storageGet(cacheKey); if (raw) return JSON.parse(raw).data; } catch (e2) {}
        throw e;
    }
}

async function loadBanksForJob(job) {
    $('bankInfo').innerHTML = '📚 正在加载题库...';
    const config = BANK_CONFIG[job];
    if (!config) { $('bankInfo').innerHTML = '❌ 未找到该工种的题库配置'; return; }
    let practiceCount = 0, featuredCount = 0, vipCount = 0;
    try {
        const data = await fetchBank(config.practice, 'thk_practice_' + job);
        const rawList = Array.isArray(data) ? data : (data.questions || data.data || []);
        banks.practice = convertQuestionFormat(rawList); practiceCount = banks.practice.length;
    } catch (e) { banks.practice = []; }
    try {
        const data = await fetchBank(config.featured, 'thk_featured_' + job);
        const rawList = Array.isArray(data) ? data : (data.questions || data.data || []);
        banks.featured = convertQuestionFormat(rawList); featuredCount = banks.featured.length;
    } catch (e) { banks.featured = []; }
    try {
        if (config.vip) {
            const data = await fetchBank(config.vip, 'thk_vip_' + job);
            const rawList = Array.isArray(data) ? data : (data.questions || data.data || []);
            banks.vip = convertQuestionFormat(rawList); vipCount = banks.vip.length;
        } else {
            banks.vip = [];
        }
    } catch (e) { banks.vip = []; }
    if (practiceCount === 0 && featuredCount === 0) { $('bankInfo').innerHTML = '❌ 题库加载失败或内容为空，请检查网络后重试'; return; }
    
    let infoHtml = `📚 <b>${escapeHtml(job)}</b> 题库已加载 ｜ 📖 题库练习：<b>${practiceCount}</b> 题 ｜ ⭐ 高频率题：<b>${featuredCount}</b> 题`;
    if (vipCount > 0) {
        infoHtml += ` ｜ 👑 VIP：<b>${vipCount}</b> 题`;
    }
    $('bankInfo').innerHTML = infoHtml;
}

/* ============================================================
   十一、通用答题渲染
   ============================================================ */
const QUIZ_UI = {
    practice: { container: 'practiceContainer', progress: 'practiceProgress', answerBtn: 'practiceAnswerBtn', prevBtn: 'practicePrevBtn', nextBtn: 'practiceNextBtn', restartBtn: 'practiceRestartBtn' },
    vip: { container: 'practiceContainer', progress: 'practiceProgress', answerBtn: 'practiceAnswerBtn', prevBtn: 'practicePrevBtn', nextBtn: 'practiceNextBtn', restartBtn: 'practiceRestartBtn' },
    featured: { container: 'featuredContainer', progress: 'featuredProgress', answerBtn: 'featuredAnswerBtn', prevBtn: 'featuredPrevBtn', nextBtn: 'featuredNextBtn', restartBtn: 'featuredRestartBtn' },
    wrong: { container: 'wrongContainer', progress: 'wrongProgress', answerBtn: null, prevBtn: 'wrongPrevBtn', nextBtn: 'wrongNextBtn', restartBtn: 'wrongRestartBtn' }
};

function buildQuestionHtml(q, index, total, opts) {
    const type = getQType(q);
    const correctLetters = toLetters(q.correctAnswer, q.options);
    const userAns = opts.userAns || '';
    const showResult = !!opts.showResult;

    let html = '<div class="question-item">';
    html += `<span class="question-type ${type}">${TYPE_TEXT[type]}</span>`;
    html += `<span class="question-number">${index + 1}/${total}</span>`;
    html += `<div class="question-title">${escapeHtml(q.question)}</div>`;
    if (type === 'multiple') html += '<div class="multi-select-hint">💡 多选题，可选择多个答案</div>';

    html += '<div class="options-container">';
    q.options.forEach((opt, i) => {
        const letter = String.fromCharCode(65 + i);
        const isCorrect = correctLetters.includes(letter);
        const isPicked = userAns.includes(letter);
        let cls = 'option';
        if (showResult) {
            if (isCorrect) cls += ' correct';
            else if (isPicked) cls += ' wrong';
        } else if (isPicked) {
            cls += ' selected';
        }
        html += `<div class="${cls}" data-letter="${letter}">${letter}. ${escapeHtml(opt)}</div>`;
    });
    html += '</div>';

    if (showResult) {
        const userLetters = toLetters(userAns, q.options);
        if (userLetters && userLetters === correctLetters) {
            html += '<div class="correct-answer" style="color:#52c41a;">✅ 回答正确！</div>';
        } else {
            html += `<div class="correct-answer">✅ 正确答案：${escapeHtml(q.correctAnswer)}</div>`;
            if (userAns) html += `<div style="color:#ff4d4f;margin-top:5px;">❌ 你的答案：${escapeHtml(userAns)}</div>`;
        }
    }
    if (opts.extraHtml) html += opts.extraHtml;
    html += '</div>';
    return html;
}

function togglePick(store, q, letter) {
    const type = getQType(q);
    if (type === 'multiple') {
        let cur = store[q.uid] || '';
        cur = cur.includes(letter) ? cur.replace(letter, '') : cur + letter;
        store[q.uid] = cur.split('').sort().join('');
    } else {
        store[q.uid] = letter;
    }
}

window.pickOption = function (mode, letter) {
    if (mode === 'exam') {
        if (!exam.active) return;
        const q = exam.list[exam.index];
        if (!q) return;
        togglePick(exam.ans, q, letter);
        renderExam();
        return;
    }
    const s = quiz[mode];
    const q = s.list[s.index];
    if (!q) return;
    if (s.sub[q.uid]) return;
    togglePick(s.ans, q, letter);
    renderQuiz(mode);
};

/* ============================================================
   十二、题库练习 / 高频率题 / 错题练习
   ============================================================ */
function initQuiz(mode) {
    if (mode === 'wrong') {
        const store = getWrongStore();
        if (!store.length) return;
        quiz.wrong.list = shuffle(store).map(item => ({ uid: nextUid(), question: item.question, options: item.options || [], correctAnswer: item.correctAnswer, type: item.type || '' }));
    } else {
        const bank = banks[mode];
        if (!bank || !bank.length) return;
        quiz[mode].list = shuffle(bank);
    }
    const s = quiz[mode];
    s.index = 0; s.ans = {}; s.sub = {}; s.rev = {};
}

function updateBtnActive(activeId) {
    const btns = ['startPracticeBtn', 'startVipPracticeBtn', 'startFeaturedBtn', 'startExamBtn', 'startWrongBtn'];
    btns.forEach(id => {
        const btn = $(id);
        if (btn) {
            if (id === activeId) btn.classList.add('active');
            else btn.classList.remove('active');
        }
    });
}

function switchPanel(type) {
    $('practiceInfo').classList.add('hidden');
    $('featuredInfo').classList.add('hidden');
    $('examInfo').classList.add('hidden');
    $('wrongInfo').classList.add('hidden');
    $('examResult').classList.add('hidden');
    $('wrongEmpty').style.display = 'none';

    if (type !== 'exam' && exam.active && exam.timer) {
        clearInterval(exam.timer);
        exam.timer = null;
        exam.timeLeft = Math.max(0, Math.round((examEndTime - Date.now()) / 1000));
        if (exam.timeLeft <= 0) {
            doSubmitExam(true);
            return;
        }
    }

    if (type === 'practice' || type === 'vip') {
        currentQuizMode = type;
        if (quiz[type].list.length === 0) initQuiz(type);
        if (quiz[type].list.length > 0) {
            $('practiceInfo').classList.remove('hidden');
            renderQuiz(type);
            updateBtnActive(type === 'practice' ? 'startPracticeBtn' : 'startVipPracticeBtn');
        }
    } else if (type === 'featured') {
        if (quiz.featured.list.length === 0) initQuiz('featured');
        if (quiz.featured.list.length > 0) {
            $('featuredInfo').classList.remove('hidden');
            renderQuiz('featured');
            updateBtnActive('startFeaturedBtn');
        }
    } else if (type === 'wrong') {
        const store = getWrongStore();
        if (!store.length) {
            $('wrongEmpty').style.display = 'block';
            updateBtnActive(null);
            return;
        }
        if (quiz.wrong.list.length === 0) initQuiz('wrong');
        $('wrongInfo').classList.remove('hidden');
        updateWrongHint();
        renderQuiz('wrong');
        updateBtnActive('startWrongBtn');
    } else if (type === 'exam') {
        if (!exam.active) {
            if (exam.list.length > 0) {
                $('examResult').classList.remove('hidden');
                updateBtnActive(null);
                return;
            }
            const seen = new Set(); const merged = [];
            [...banks.practice, ...banks.featured].forEach(q => { if (seen.has(q.question)) return; seen.add(q.question); merged.push(q); });
            if (merged.length < 10) { showToast('题库题目太少，无法开始考试'); return; }
            const count = Math.min(EXAM_MAX_Q, merged.length);
            exam.list = shuffle(merged).slice(0, count);
            exam.index = 0; exam.ans = {}; exam.rev = {}; 
            exam.timeLeft = EXAM_MINUTES * 60; 
            exam.active = true;
            
            examEndTime = Date.now() + exam.timeLeft * 1000; 
            
            if (exam.timer) clearInterval(exam.timer);
            exam.timer = setInterval(() => { 
                const now = Date.now();
                exam.timeLeft = Math.max(0, Math.round((examEndTime - now) / 1000));
                updateTimerDisplay(); 
                if (exam.timeLeft <= 0) { 
                    clearInterval(exam.timer); 
                    exam.timer = null; 
                    doSubmitExam(true); 
                } 
            }, 1000);
            updateTimerDisplay();
        } else {
            if (!exam.timer) {
                if (exam.timeLeft <= 0) {
                    doSubmitExam(true);
                    return;
                }
                examEndTime = Date.now() + exam.timeLeft * 1000;
                exam.timer = setInterval(() => {
                    const now = Date.now();
                    exam.timeLeft = Math.max(0, Math.round((examEndTime - now) / 1000));
                    updateTimerDisplay();
                    if (exam.timeLeft <= 0) {
                        clearInterval(exam.timer);
                        exam.timer = null;
                        doSubmitExam(true);
                    }
                }, 1000);
                updateTimerDisplay();
            }
        }
        $('examInfo').classList.remove('hidden');
        renderExam();
        updateBtnActive('startExamBtn');
    }
}

function restartQuiz(mode) {
    if (mode === 'wrong') {
        const store = getWrongStore();
        if (!store.length) { showToast('错题本是空的，无法重新开始'); return; }
        quiz.wrong.list = shuffle(store).map(item => ({ uid: nextUid(), question: item.question, options: item.options || [], correctAnswer: item.correctAnswer, type: item.type || '' }));
    } else {
        const bank = banks[mode];
        if (!bank || !bank.length) { showToast('题库未加载，无法重新开始'); return; }
        quiz[mode].list = shuffle(bank);
    }
    const s = quiz[mode];
    s.index = 0; s.ans = {}; s.sub = {}; s.rev = {};
    showToast('已重新开始本次练习'); 
    if(mode !== 'wrong') {
        $('practiceInfo').classList.remove('hidden');
    } else {
        $('wrongInfo').classList.remove('hidden');
    }
    renderQuiz(mode);
}

function updateWrongHint() {
    const total = getWrongStore().length;
    const hint = $('wrongHint');
    if (hint) hint.textContent = `📌 错题本共 ${total} 题，答题正确将自动从错题本移除`;
}

function renderQuiz(mode) {
    const s = quiz[mode]; const ui = QUIZ_UI[mode]; const q = s.list[s.index];
    if (!q) return;
    const submitted = !!s.sub[q.uid]; const revealed = !!s.rev[q.uid]; const userAns = s.ans[q.uid] || '';
    $(ui.container).innerHTML = buildQuestionHtml(q, s.index, s.list.length, { userAns, submitted, showResult: submitted || revealed });
    $(ui.progress).textContent = `第 ${s.index + 1} 题 / 共 ${s.list.length} 题`;
    $(ui.container).querySelectorAll('.option').forEach(el => { el.addEventListener('click', () => window.pickOption(mode, el.dataset.letter)); });
    if (ui.answerBtn) { const btn = $(ui.answerBtn); btn.textContent = revealed ? '🙈 隐藏答案' : '💡 显示答案'; }
    $(ui.prevBtn).disabled = s.index === 0; $(ui.nextBtn).disabled = s.index >= s.list.length - 1;
}

function goQuiz(mode, delta) {
    const s = quiz[mode]; const q = s.list[s.index];
    if (q && !s.sub[q.uid] && (s.ans[q.uid] || '').trim() !== '') submitQuizAnswer(mode, true);
    const next = s.index + delta;
    if (next < 0 || next >= s.list.length) return;
    s.index = next; renderQuiz(mode);
}

function submitQuizAnswer(mode, silent = false) {
    const s = quiz[mode]; const q = s.list[s.index];
    if (!q || s.sub[q.uid]) return true;
    const userAns = s.ans[q.uid] || '';
    if (!userAns) { if (!silent) showToast('请先选择答案'); return false; }
    s.sub[q.uid] = true;
    const correct = toLetters(q.correctAnswer, q.options);
    const mine = toLetters(userAns, q.options);
    const isRight = correct && mine && correct === mine;
    if (mode === 'wrong') {
        if (isRight) { removeWrongQuestion(q.question); refreshWrongBadge(); updateWrongHint(); }
    } else {
        if (!isRight) { saveWrongQuestions([q]); refreshWrongBadge(); }
    }
    if (!silent) renderQuiz(mode);
    return true;
}

function toggleQuizAnswer(mode) {
    const s = quiz[mode]; const q = s.list[s.index];
    if (!q) return;
    s.rev[q.uid] = !s.rev[q.uid];
    renderQuiz(mode);
}

/* ============================================================
   十三、模拟考试
   ============================================================ */
function updateTimerDisplay() {
    const m = Math.floor(exam.timeLeft / 60), s = exam.timeLeft % 60;
    const el = $('examTimer');
    el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    el.style.color = exam.timeLeft <= 300 ? '#ff4d4f' : '#1890ff';
}

function renderExam() {
    const q = exam.list[exam.index];
    if (!q) return;
    const revealed = !!exam.rev[q.uid]; const userAns = exam.ans[q.uid] || '';
    let extraHtml = '';
    if (userAns && !revealed) extraHtml = `<div class="selected-options">已选择：${userAns.split('').join('、')}</div>`;

    $('examContainer').innerHTML = buildQuestionHtml(q, exam.index, exam.list.length, { userAns, submitted: false, showResult: revealed, extraHtml });
    $('examContainer').querySelectorAll('.option').forEach(el => { el.addEventListener('click', () => window.pickOption('exam', el.dataset.letter)); });
    $('examProgress').textContent = `第 ${exam.index + 1} 题 / 共 ${exam.list.length} 题`;
    $('examPrevBtn').disabled = exam.index === 0; $('examNextBtn').disabled = exam.index >= exam.list.length - 1;
    $('examAnswerBtn').textContent = revealed ? '🙈 隐藏答案' : '💡 显示答案';
}

function toggleExamAnswer() {
    const q = exam.list[exam.index];
    if (!q) return;
    exam.rev[q.uid] = !exam.rev[q.uid];
    renderExam();
}

function submitExam() { if (!exam.active) return; showConfirm('确定提前交卷吗？', () => doSubmitExam(false)); }

function doSubmitExam(auto) {
    if (!exam.active) return;
    exam.active = false;
    if (exam.timer) { clearInterval(exam.timer); exam.timer = null; }
    if (auto) showToast('考试时间到，已自动交卷！');
    
    const usedSeconds = EXAM_MINUTES * 60 - Math.max(0, exam.timeLeft);
    let correctCount = 0; const wrongList = [];

    exam.list.forEach(q => {
        const mine = exam.ans[q.uid] || '';
        const correct = toLetters(q.correctAnswer, q.options);
        const userLetters = toLetters(mine, q.options);
        if (mine && correct && userLetters === correct) {
            correctCount++;
        } else {
            wrongList.push(q);
        }
    });

    saveWrongQuestions(wrongList); refreshWrongBadge();
    const pct = Math.round((correctCount / exam.list.length) * 100);
    const passed = pct >= PASS_SCORE;
    saveScoreRecord(pct, correctCount, exam.list.length, usedSeconds); renderScoreHistory();
    $('examInfo').classList.add('hidden');
    
    updateBtnActive(null);
    
    const resultEl = $('examResult'); resultEl.classList.remove('hidden');
    resultEl.innerHTML = `
        <h2>考试结果${auto ? '（时间到，自动交卷）' : ''}</h2>
        <div class="result-score ${passed ? 'result-pass' : 'result-fail'}">${pct}分</div>
        <div style="font-size:16px;">${passed ? '🎉 恭喜通过！' : '😢 很遗憾，未通过'}</div>
        <div class="result-details">
            <div>✅ 正确题数：${correctCount} 题</div>
            <div>❌ 错误题数：${exam.list.length - correctCount} 题</div>
            <div>📝 总题数：${exam.list.length} 题</div>
            <div>⏱️ 用时：${formatDuration(usedSeconds)}</div>
            <div>🎯 及格线：${PASS_SCORE} 分</div>
            ${wrongList.length ? `<div style="color:#fa541c;margin-top:8px;">⚠️ 本次错题 ${wrongList.length} 题已加入「错题练习」</div>` : ''}
        </div>
        <button class="exam-btn-control" id="resetExamBtn">重新考试</button>
    `;
    $('resetExamBtn').addEventListener('click', resetExam);
}

function resetExam() {
    $('examResult').classList.add('hidden'); 
    exam.active = false; 
    exam.list = []; // 清空，以便下次重新开始
    $('examTimer').style.color = '#1890ff'; $('examTimer').textContent = `${String(EXAM_MINUTES).padStart(2, '0')}:00`;
    updateBtnActive(null);
}

/* ============================================================
   十四、成绩统计
   ============================================================ */
function scoreHistoryKey() { return 'thk_scores_' + (currentUser ? currentUser.phone : 'default'); }
function getScoreHistory() {
    try { const raw = storageGet(scoreHistoryKey()); if (!raw) return []; const arr = JSON.parse(raw); return Array.isArray(arr) ? arr : []; } catch (e) { return []; }
}
function saveScoreRecord(pct, correct, total, duration) {
    const history = getScoreHistory();
    history.push({ score: pct, correct, total, duration: duration || 0, time: Date.now() });
    while (history.length > SCORE_MAX) history.shift();
    storageSet(scoreHistoryKey(), JSON.stringify(history));
}

function renderScoreHistory() {
    const history = getScoreHistory(); const content = $('scoreHistoryContent');
    if (!history.length) { content.innerHTML = `<div class="score-empty"><span class="big">📊</span>暂无成绩记录<br><small style="color:#bbb;">完成一次模拟考试（交卷）后，成绩会自动记录在这里，最多保留最近 20 次</small></div>`; return; }
    const avg = Math.round(history.reduce((s, h) => s + h.score, 0) / history.length);
    const passCount = history.filter(h => h.score >= PASS_SCORE).length;
    const maxScore = Math.max(...history.map(h => h.score));
    const minScore = Math.min(...history.map(h => h.score));
    const maxVal = Math.max(...history.map(h => h.score), 100);
    let trend = '<div class="score-trend">';
    history.forEach(h => { const height = Math.max((h.score / maxVal) * 100, 5); const cls = h.score >= PASS_SCORE ? 'pass-bar' : 'fail-bar'; trend += `<div class="bar ${cls}" style="height:${height}%"><span>${h.score}</span></div>`; });
    trend += '</div>';
    const summary = `<div class="score-summary"><div><span class="num">${avg}</span>平均分</div><div><span class="num">${passCount}/${history.length}</span>通过次数</div><div><span class="num">${maxScore}</span>最高分</div><div><span class="num">${minScore}</span>最低分</div></div>`;
    let table = '<table class="score-table"><tr><th>序号</th><th>日期</th><th>成绩</th><th>用时</th><th>正确/总数</th><th>结果</th></tr>';
    const reversed = history.slice().reverse();
    reversed.forEach((h, i) => {
        const d = new Date(h.time);
        const dateStr = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        const passed = h.score >= PASS_SCORE; const cls = passed ? 'pass' : 'fail';
        const durStr = h.duration != null ? formatDuration(h.duration) : '—';
        table += `<tr><td>${i + 1}</td><td>${dateStr}</td><td class="${cls}">${h.score}分</td><td>${durStr}</td><td>${h.correct}/${h.total}</td><td class="${cls}">${passed ? '通过' : '未通过'}</td></tr>`;
    });
    table += '</table>';
    content.innerHTML = trend + summary + table;
}

/* ============================================================
   十五、错题本
   ============================================================ */
function wrongKey() { return 'thk_wrong_' + (currentUser ? currentUser.phone : 'default'); }
function getWrongStore() {
    try { const raw = storageGet(wrongKey()); if (!raw) return []; const arr = JSON.parse(raw); return Array.isArray(arr) ? arr : []; } catch (e) { return []; }
}
function setWrongStore(arr) { storageSet(wrongKey(), JSON.stringify(arr)); }
function saveWrongQuestions(list) {
    if (!list || !list.length) return;
    const store = getWrongStore(); const existing = new Set(store.map(q => (q.question || '').slice(0, 80)));
    list.forEach(q => {
        const key = (q.question || '').slice(0, 80); if (!key || existing.has(key)) return;
        store.push({ question: q.question, options: q.options, correctAnswer: q.correctAnswer, type: q.type || '', addTime: Date.now() });
        existing.add(key);
    });
    setWrongStore(store);
}
function removeWrongQuestion(questionText) {
    const store = getWrongStore(); const key = (questionText || '').slice(0, 80);
    const filtered = store.filter(q => (q.question || '').slice(0, 80) !== key);
    if (filtered.length !== store.length) setWrongStore(filtered);
}
function refreshWrongBadge() {
    const count = getWrongStore().length; const badge = $('wrongCountBadge');
    if (count > 0) { badge.textContent = count; badge.style.display = 'inline-block'; } else { badge.style.display = 'none'; }
}
function clearWrongBook() { showConfirm('确定清空错题本吗？此操作不可恢复。', doClearWrongBook); }
function doClearWrongBook() {
    setWrongStore([]); refreshWrongBadge();
    quiz.wrong.list = []; $('wrongInfo').classList.add('hidden'); $('wrongEmpty').style.display = 'block';
    showToast('错题本已清空');
    updateBtnActive(null);
}

/* ============================================================
   十六、事件绑定
   ============================================================ */
function bindEvents() {
    $('loginBtn').addEventListener('click', checkLogin);
    $('phoneInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('codeInput').focus(); });
    $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkLogin(); });
    $('logoutBtn').addEventListener('click', logout);
    
    $('startPracticeBtn').addEventListener('click', () => switchPanel('practice'));
    
    $('startVipPracticeBtn').addEventListener('click', () => {
        if (!currentUser || (!currentUser.isAdmin && !currentUser.isVIP)) {
            showConfirm('你还不是VIP，请联系管理员', () => {});
            return;
        }
        switchPanel('vip');
    });

    $('practicePrevBtn').addEventListener('click', () => goQuiz(currentQuizMode, -1));
    $('practiceNextBtn').addEventListener('click', () => goQuiz(currentQuizMode, 1));
    $('practiceAnswerBtn').addEventListener('click', () => toggleQuizAnswer(currentQuizMode));
    $('practiceRestartBtn').addEventListener('click', () => restartQuiz(currentQuizMode));
    
    $('startFeaturedBtn').addEventListener('click', () => switchPanel('featured'));
    $('featuredPrevBtn').addEventListener('click', () => goQuiz('featured', -1));
    $('featuredNextBtn').addEventListener('click', () => goQuiz('featured', 1));
    $('featuredAnswerBtn').addEventListener('click', () => toggleQuizAnswer('featured'));
    $('featuredRestartBtn').addEventListener('click', () => restartQuiz('featured'));
    
    $('startWrongBtn').addEventListener('click', () => switchPanel('wrong'));
    $('wrongPrevBtn').addEventListener('click', () => goQuiz('wrong', -1));
    $('wrongNextBtn').addEventListener('click', () => goQuiz('wrong', 1));
    $('wrongClearBtn').addEventListener('click', clearWrongBook);
    $('wrongRestartBtn').addEventListener('click', () => restartQuiz('wrong'));
    
    $('startExamBtn').addEventListener('click', () => switchPanel('exam'));
    $('examPrevBtn').addEventListener('click', () => { if (exam.index > 0) { exam.index--; renderExam(); } });
    $('examNextBtn').addEventListener('click', () => { if (exam.index < exam.list.length - 1) { exam.index++; renderExam(); } });
    $('examAnswerBtn').addEventListener('click', toggleExamAnswer);
    $('submitExamBtn').addEventListener('click', submitExam);

    window.addEventListener('storage', (e) => {
        if (!currentUser) return;
        const activeKey = 'thk_active_' + currentUser.phone;
        if (e.key === activeKey) {
            if (e.newValue !== __mySessionId) {
                showToast('该账号已在其他窗口或设备登录，当前会话自动退出');
                storageRemove('thk_session');
                if (exam.timer) { clearInterval(exam.timer); exam.timer = null; }
                exam.active = false;
                currentUser = null;
                banks.practice = []; banks.featured = []; banks.vip = [];
                quiz.practice = newQuiz(); quiz.featured = newQuiz(); quiz.wrong = newQuiz(); quiz.vip = newQuiz();
                $('passwordModal').style.display = 'flex';
                $('mainContent').style.display = 'none';
                $('userInfo').style.display = 'none';
                $('validityInfo').style.display = 'none';
                $('storageWarn').style.display = 'none';
                $('phoneInput').value = ''; $('codeInput').value = '';
                $('loginError').style.display = 'none';
                try { $('phoneInput').focus(); } catch (err) {}
                resetAllPanels();
            }
        }
    });
}

/* ============================================================
   ★★★ 十七、下拉刷新题库 ★★★
   ============================================================ */
let __ptrIndicator = null;
let __ptrStartY = 0;
let __ptrPulling = false;
let __ptrRefreshing = false;
const __PTR_THRESHOLD = 80;

function setupPullToRefresh() {
    __ptrIndicator = document.createElement('div');
    __ptrIndicator.style.cssText = [
        'position: fixed', 'top: 0', 'left: 0', 'right: 0', 'height: 0',
        'display: flex', 'align-items: center', 'justify-content: center',
        'background: linear-gradient(180deg, #1890ff, #40a9ff)', 'color: #fff',
        'font-size: 13px', 'font-weight: 600', 'overflow: hidden',
        'transition: height 0.15s ease', 'z-index: 9999',
        'padding-top: env(safe-area-inset-top)', 'box-shadow: 0 2px 8px rgba(24,144,255,.3)'
    ].join(';');
    __ptrIndicator.textContent = '下拉刷新题库';
    document.body.appendChild(__ptrIndicator);

    document.addEventListener('touchstart', (e) => {
        if (!currentUser) return;
        if (__ptrRefreshing) return;
        if (window.scrollY > 0) return;
        __ptrStartY = e.touches[0].clientY;
        __ptrPulling = true;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
        if (!__ptrPulling) return;
        const dy = e.touches[0].clientY - __ptrStartY;
        if (dy > 0 && window.scrollY === 0) {
            const h = Math.min(dy * 0.45, 90);
            __ptrIndicator.style.height = h + 'px';
            __ptrIndicator.textContent = dy > __PTR_THRESHOLD ? '松手刷新题库' : '下拉刷新题库';
        } else if (dy < -10) {
            __ptrPulling = false;
            __ptrIndicator.style.height = '0px';
        }
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
        if (!__ptrPulling) return;
        const endY = e.changedTouches[0] ? e.changedTouches[0].clientY : 0;
        const dy = endY - __ptrStartY;
        __ptrPulling = false;
        __ptrIndicator.style.height = '0px';
        if (dy > __PTR_THRESHOLD) {
            doRefreshBank();
        }
    });
}

async function doRefreshBank() {
    if (__ptrRefreshing) return;
    if (!currentUser) return;

    const job = currentUser.isAdmin ? $('jobSelector').value : currentUser.job;
    if (!job) return;

    __ptrRefreshing = true;
    __ptrIndicator.textContent = '🔄 正在刷新题库...';
    __ptrIndicator.style.height = '40px';

    try {
        $('bankInfo').innerHTML = '🔄 正在清除本地缓存...';
        try {
            const keysToRemove = [];
            for (let i = 0; i < window.localStorage.length; i++) {
                const k = window.localStorage.key(i);
                if (k && (k.startsWith('thk_practice_') || k.startsWith('thk_featured_') || k.startsWith('thk_vip_'))) {
                    keysToRemove.push(k);
                }
            }
            keysToRemove.forEach(k => window.localStorage.removeItem(k));
        } catch (e) {}

        const config = BANK_CONFIG[job];
        if (config) {
            $('bankInfo').innerHTML = '🔄 正在通知 CDN 刷新（约 2 秒）...';
            __ptrIndicator.textContent = '🔄 通知 CDN 刷新...';
            const purgeUrls = [
                `https://purge.jsdelivr.net/gh/jrh168/thk-data@main/banks/${config.practice}`,
                `https://purge.jsdelivr.net/gh/jrh168/thk-data@main/banks/${config.featured}`
            ];
            if (config.vip) purgeUrls.push(`https://purge.jsdelivr.net/gh/jrh168/thk-data@main/banks/${config.vip}`);
            
            await Promise.all(purgeUrls.map(url =>
                fetch(url, { cache: 'no-store', mode: 'cors' }).catch(() => null)
            ));
            await new Promise(r => setTimeout(r, 1500));
        }

        $('bankInfo').innerHTML = '🔄 正在重新加载题库...';
        __ptrIndicator.textContent = '🔄 重新加载中...';
        
        // 下拉刷新时顺便也刷新一下名单
        await loadUsers();
        await loadBanksForJob(job);

        __ptrIndicator.textContent = '✅ 刷新成功';
        setTimeout(() => { __ptrIndicator.style.height = '0px'; }, 800);
        showToast('题库与名单已刷新到最新');
    } catch (e) {
        __ptrIndicator.textContent = '❌ 刷新失败';
        setTimeout(() => { __ptrIndicator.style.height = '0px'; }, 1500);
        showToast('刷新失败，请检查网络后重试');
    } finally {
        __ptrRefreshing = false;
        setTimeout(() => {
            __ptrIndicator.style.height = '0px';
            __ptrIndicator.textContent = '下拉刷新题库';
        }, 2000);
    }
}

/* ============================================================
   启动
   ============================================================ */
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('keydown', event => {
    if (event.key === 'F12' || 
        (event.ctrlKey && event.shiftKey && ['I', 'J', 'C'].includes(event.key.toUpperCase())) ||
        (event.ctrlKey && event.key.toUpperCase() === 'U')) {
        event.preventDefault();
        return false;
    }
});

async function boot() {
    const logoImg = $('appLogo');
    if (logoImg && LOGO_URL) logoImg.src = LOGO_URL;
    getStorage(); bindEvents();
    setupPullToRefresh();

    // ★ 启动时加载 users.json 名单
    $('loginError').style.display = 'block';
    $('loginError').style.color = '#1890ff';
    $('loginError').textContent = '正在拉取用户名单，请稍候...';
    
    await loadUsers();

    $('loginError').style.display = 'none';
    $('loginError').style.color = '#ff4d4f';

    if (WHITELIST.length === 0) {
        $('loginError').style.display = 'block';
        $('loginError').textContent = '⚠️ 名单加载失败，请检查网络或 users.json 格式';
    }

    const token = new URLSearchParams(location.search).get('token');
    if (token && QR_TOKENS[token]) {
        const user = findUser(QR_TOKENS[token]); const v = validateUser(user);
        if (v.ok) { loginSuccess(user); return; }
        showLoginError(v.msg);
    }
    try {
        const raw = storageGet('thk_session');
        if (raw) {
            const sess = JSON.parse(raw);
            if (sess && sess.sessionEnd > Date.now()) {
                const user = findUser(sess.phone); const v = validateUser(user);
                if (v.ok) { loginSuccess(user); return; }
                storageRemove('thk_session');
            }
        }
    } catch (e) {}
    $('phoneInput').focus();
}

if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
